<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Lads League | Live Command Center</title>

    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Share+Tech+Mono&family=Titillium+Web:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --f1-dark: #060609; 
            --f1-card: #111118; 
            --f1-border: #22222d;
            
            /* Team Colors */
            --merc: #00D7B6;
            --rb: #4781D7;
            --fer: #ED1131;
            --mcl: #F47600;
            --am: #229971;
        }

        body { 
            font-family: 'Titillium Web', sans-serif; 
            background: var(--f1-dark); 
            color: white; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        
        .brand-header { 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px; 
        }
        .brand-logo { 
            height: 60px; 
            object-fit: contain; 
            transition: transform 0.2s ease;
        }
        .brand-logo:hover { transform: scale(1.05); }
        .header-title {
            font-family: 'Chakra Petch', sans-serif;
            color: #888;
            letter-spacing: 4px;
            font-size: 20px;
            text-transform: uppercase;
            margin: 0;
            padding-top: 5px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(700px, 1fr)); 
            gap: 25px; 
            width: 100%;
            max-width: 98vw;
            margin: 0 auto;
        }

        .stream-box {
            background: var(--f1-card);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--f1-border);
            border-top: 4px solid var(--team-color, #444);
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            cursor: grab;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .stream-box:active { cursor: grabbing; }
        .stream-box.dragging { opacity: 0.4; transform: scale(0.98); }
        .stream-box.drag-over { border: 2px dashed #fff; opacity: 0.8; }

        .stream-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #0a0a0e;
            border-bottom: 1px solid var(--f1-border);
        }

        .driver-info { display: flex; align-items: center; gap: 12px; }
        .team-logo { height: 24px; object-fit: contain; }

        .driver-name {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            margin: 0;
            text-transform: uppercase;
        }

        .badge {
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
            border: 1px solid #333;
            background: #050508;
        }
        .badge-pc { color: #00FF41; border-color: rgba(0, 255, 65, 0.3); }
        .badge-xb { color: #107C10; border-color: rgba(16, 124, 16, 0.4); }
        .badge-ps { color: #4781D7; border-color: rgba(71, 129, 215, 0.4); }

        .iframe-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9; 
            background: #000;
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .disable-iframes iframe { pointer-events: none; }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('stream-grid');
            const boxes = document.querySelectorAll('.stream-box');
            let draggedItem = null;

            // --- LOAD SAVED ORDER ---
            // Check if there's a saved layout order in local storage
            const savedOrder = JSON.parse(localStorage.getItem('f1lads_grid_order'));
            if (savedOrder) {
                // Re-append the boxes in the saved order
                savedOrder.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) grid.appendChild(el);
                });
            }

            // --- DRAG AND DROP LOGIC ---
            boxes.forEach(box => {
                box.addEventListener('dragstart', function(e) {
                    draggedItem = this;
                    document.body.classList.add('disable-iframes');
                    setTimeout(() => this.classList.add('dragging'), 0);
                });

                box.addEventListener('dragend', function() {
                    this.classList.remove('dragging');
                    document.body.classList.remove('disable-iframes');
                    draggedItem = null;
                    
                    // Save the new order to local storage after dropping
                    const currentOrder = Array.from(document.querySelectorAll('.stream-box')).map(b => b.id);
                    localStorage.setItem('f1lads_grid_order', JSON.stringify(currentOrder));
                });

                box.addEventListener('dragover', function(e) {
                    e.preventDefault(); 
                });

                box.addEventListener('dragenter', function(e) {
                    e.preventDefault();
                    if (this !== draggedItem) {
                        this.classList.add('drag-over');
                    }
                });

                box.addEventListener('dragleave', function() {
                    this.classList.remove('drag-over');
                });

                box.addEventListener('drop', function() {
                    this.classList.remove('drag-over');
                    if (this !== draggedItem) {
                        let allBoxes = [...document.querySelectorAll('.stream-box')];
                        let draggedIndex = allBoxes.indexOf(draggedItem);
                        let targetIndex = allBoxes.indexOf(this);
                        
                        if (draggedIndex < targetIndex) {
                            this.parentNode.insertBefore(draggedItem, this.nextSibling);
                        } else {
                            this.parentNode.insertBefore(draggedItem, this);
                        }
                    }
                });
            });
        });
    </script>
