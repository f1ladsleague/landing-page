<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Lads | Wildcard Terminal</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/f1ladsleague/sidebetting/9e649c454badbe13d3d17c100f0f535a7555a058/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Share+Tech+Mono&family=Titillium+Web:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --f1-dark: #09090c; --f1-card: #111118; --f1-border: #22222d; --theme-red: #e10600; }
        body { font-family: 'Titillium Web', sans-serif; background: var(--f1-dark); color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .dashboard { width: 100%; max-width: 600px; background: var(--f1-card); padding: 30px; border-radius: 8px; border: 1px solid var(--f1-border); border-top: 4px solid var(--theme-red); box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
        .logo { max-width: 150px; margin-bottom: 20px; display: block; margin-left: auto; margin-right: auto; cursor: pointer; transition: 0.2s; }
        .logo:hover { transform: scale(1.05); }
        
        .sys-header { font-family: 'Share Tech Mono', monospace; color: #888; text-align: center; margin-bottom: 30px; letter-spacing: 2px; }
        
        /* Auth Section */
        #auth-section { display: flex; flex-direction: column; gap: 15px; }
        select, input { padding: 15px; font-family: 'Share Tech Mono', monospace; background: #000; color: white; border: 1px solid #444; border-radius: 4px; font-size: 16px; text-align: center; }
        button { padding: 15px; background: var(--theme-red); color: white; font-weight: 900; text-transform: uppercase; border: none; border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 18px; }
        button:hover:not(:disabled) { background: #ff1a1a; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Race Cards */
        #portal-section { display: none; }
        .race-card { background: #050508; border: 1px solid #333; margin-bottom: 20px; padding: 20px; border-radius: 6px; }
        
        .color-theme-0 { border-top: 4px solid #00D7B6; } 
        .color-theme-1 { border-top: 4px solid #ae37de; } 
        .title-theme-0 { color: #00D7B6; }
        .title-theme-1 { color: #ae37de; }
        
        .round-title { font-size: 22px; font-weight: 900; margin: 0 0 5px 0; text-transform: uppercase; }
        .date-sub { font-family: 'Share Tech Mono', monospace; font-size: 16px; font-weight: bold; color: #ffcc00; margin-bottom: 15px; letter-spacing: 1px; }
        
        .track-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #222; padding: 10px 0; }
        .track-row:last-child { border-bottom: none; }
        .track-label { color: #888; font-size: 12px; letter-spacing: 1px; }
        .track-value { font-family: 'Chakra Petch', sans-serif; font-weight: 700; color: #fff; text-align: right; }
        .text-red { color: var(--theme-red); }
        .text-green { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.4); }

        .countdown { font-family: 'Share Tech Mono', monospace; font-size: 24px; color: #F47600; margin-top: 5px; }

        .back-btn { background: #333; color: #fff; width: 100%; margin-top: 10px; font-size: 14px; }
        .back-btn:hover { background: #555; }
    </style>
</head>
<body>

    <a href="https://f1lads.com">
        <img src="https://raw.githubusercontent.com/f1ladsleague/landing-page/main/Team_Photos/Logo.png" class="logo" alt="Home">
    </a>
    
    <div class="dashboard">
        <div class="sys-header">/// WILDCARD TRACKS ///</div>
        
        <div id="auth-section">
            <select id="driver-select">
                <option value="">-- SELECT DRIVER ID --</option>
                <option value="Sameera">Sameera</option>
                <option value="Mapa">Mapa</option>
                <option value="Shahan">Shahan</option>
                <option value="Nuwie G">Nuwie G</option>
                <option value="Kalpa">Kalpa</option>
                <option value="Shiyan">Shiyan</option>
                <option value="Sahan">Sahan</option>
                <option value="Rodda">Rodda</option>
                <option value="Eranga">Eranga</option>
                <option value="Nippa E">Nippa E</option>
            </select>
            <input type="password" id="pin-input" placeholder="4-DIGIT PIN" maxlength="4">
            <button onclick="authenticate()" id="login-btn">Authenticate</button>
            <div id="error-msg" style="color: #ff4444; text-align: center; font-family: monospace; margin-top: 10px;"></div>
        </div>

        <div id="portal-section">
            <div style="display: flex; justify-content: flex-end; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px;">
                <div style="font-weight: 900; font-size: 18px;" id="user-display"></div>
            </div>
            <div id="races-container"></div>
            <button class="back-btn" onclick="logout()">LOGOUT / RETURN</button>
        </div>
    </div>

    <script>
        // --- PASTE YOUR GOOGLE APP URL HERE ---
        const API_URL = "https://script.google.com/macros/s/AKfycbzaLPfFPFVFATznJh5LJ2mhfhMOYtb0zxL-2JvjRDjjEKCXKFXoPwusGLKzo1sVbH8_/exec"; 
        
        let timers = [];

        document.getElementById('pin-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') authenticate();
        });

        async function authenticate() {
            const driver = document.getElementById('driver-select').value;
            const pin = document.getElementById('pin-input').value;
            const btn = document.getElementById('login-btn');
            const errorMsg = document.getElementById('error-msg');
            
            if(!driver || !pin) return;
            
            btn.innerText = "VERIFYING...";
            btn.disabled = true;
            errorMsg.innerText = "";

            try {
                const response = await fetch(`${API_URL}?driver=${encodeURIComponent(driver)}&pin=${encodeURIComponent(pin)}`);
                const data = await response.json();
                
                if (data.error) {
                    btn.innerText = "AUTHENTICATE";
                    btn.disabled = false;
                    errorMsg.innerText = data.error;
                } else {
                    renderDashboard(data, driver);
                }
            } catch (err) {
                btn.innerText = "AUTHENTICATE";
                btn.disabled = false;
                errorMsg.innerText = "NETWORK ERROR: Could not connect to FIA database.";
            }
        }

        function renderDashboard(data, driverName) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('portal-section').style.display = 'block';
            document.getElementById('user-display').innerText = driverName.toUpperCase() + ` (P${data.rank})`;

            const container = document.getElementById('races-container');
            container.innerHTML = "";
            timers.forEach(t => clearInterval(t)); 

            data.races.forEach((race, index) => {
                const dateStr = new Date(race.raceDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
                const themeIdx = index % 2; 
                
                let html = `<div class="race-card color-theme-${themeIdx}">
                                <h3 class="round-title title-theme-${themeIdx}">ROUND ${race.round} // ${race.eventName}</h3>
                                <div class="date-sub">RACE DATE: ${dateStr}</div>`;
                
                if (race.isUnlocked) {
                    if (race.sprint.includes('|')) {
                        const sprints = race.sprint.split('|');
                        sprints.forEach((sTrack, idx) => {
                            html += `<div class="track-row">
                                        <span class="track-label">SPRINT RACE 0${idx + 1}</span>
                                        <span class="track-value text-green">${sTrack.trim()}</span>
                                    </div>`;
                        });
                    } else {
                        html += `<div class="track-row">
                                    <span class="track-label">SPRINT RACE</span>
                                    <span class="track-value text-green">${race.sprint}</span>
                                </div>`;
                    }
                    html += `   <div class="track-row">
                                    <span class="track-label">FEATURE RACE</span>
                                    <span class="track-value text-green">${race.feature}</span>
                                </div>`;
                } else {
                    if (data.rank === 1) {
                        html += `   <div class="track-row">
                                        <span class="track-label">STATUS</span>
                                        <span class="track-value text-red">[ ACCESS DENIED ]</span>
                                    </div>
                                    <div style="color: #ff4444; text-align: center; margin-top: 15px; font-family: 'Share Tech Mono', monospace; font-size: 14px;">
                                        YOU ARE NOT ELIGIBLE TO VIEW THE WILDCARD TRACKS AS YOU ARE P1
                                    </div>`;
                    } else {
                        // Format the unlock date string explicitly for Melbourne Time
                        const unlockDateObj = new Date(race.unlockDate);
                        const options = { timeZone: 'Australia/Melbourne', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: 'numeric', minute: '2-digit' };
                        const unlockDateString = new Intl.DateTimeFormat('en-AU', options).format(unlockDateObj).toUpperCase() + " (MELBOURNE TIME)";
                        
                        html += `   <div class="track-row">
                                        <span class="track-label">STATUS</span>
                                        <span class="track-value text-red">[ ENCRYPTED ]</span>
                                    </div>
                                    <div style="text-align: center; margin-top: 15px; background: #050508; border: 1px solid #222; padding: 15px; border-radius: 4px;">
                                        <div style="color: #888; font-size: 11px; letter-spacing: 2px;">DECRYPTS EXACTLY ON:</div>
                                        <div style="color: #00D7B6; font-size: 14px; font-weight: bold; margin-top: 5px;">${unlockDateString}</div>
                                        <div class="countdown" id="timer-${index}">--:--:--:--</div>
                                    </div>`;
                                    
                        startCountdown(`timer-${index}`, race.unlockDate);
                    }
                }
                
                html += `</div>`;
                container.innerHTML += html;
            });
            
            document.getElementById('login-btn').innerText = "AUTHENTICATE";
            document.getElementById('login-btn').disabled = false;
        }

        function startCountdown(elementId, targetTimestamp) {
            const timer = setInterval(() => {
                const now = new Date().getTime();
                const distance = targetTimestamp - now;

                if (distance < 0) {
                    clearInterval(timer);
                    document.getElementById(elementId).innerText = "REFRESH TO DECRYPT";
                    document.getElementById(elementId).style.color = "#00D7B6";
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                const seconds = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');

                document.getElementById(elementId).innerText = `${days}D ${hours}H ${minutes}M ${seconds}S`;
            }, 1000);
            timers.push(timer);
        }

        function logout() {
            document.getElementById('portal-section').style.display = 'none';
            document.getElementById('auth-section').style.display = 'flex';
            document.getElementById('pin-input').value = "";
            timers.forEach(t => clearInterval(t)); 
        }
    </script>
</body>
</html>
