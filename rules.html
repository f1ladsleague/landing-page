<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rules & Regulations | F1 Lads</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/f1ladsleague/landing-page/main/Team_Photos/Logo.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Formula1';
            src: url('https://raw.githubusercontent.com/f1ladsleague/landing-page/main/Formula1.ttf') format('truetype');
        }

        :root { 
            --f1-red: #e10600; 
            --f1-dark: #15151e; 
            --f1-card: #1f1f27;
            --f1-hover: #2a2a35;
        }
        
        body { 
            font-family: 'Titillium Web', sans-serif; 
            color: #fff; 
            margin: 0; 
            padding: 0; 
            background-color: var(--f1-dark);
            background-image: linear-gradient(rgba(21, 21, 30, 0.92), rgba(21, 21, 30, 0.96)), url('https://raw.githubusercontent.com/f1ladsleague/landing-page/main/Team_Photos/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* CONSISTENT CINEMATIC HERO */
        .hero {
            text-align: center;
            padding: 120px 20px 140px 20px;
            background: linear-gradient(180deg, rgba(21, 21, 30, 0.3) 0%, rgba(21, 21, 30, 0.98) 100%), url('https://raw.githubusercontent.com/f1ladsleague/landing-page/main/Team_Photos/Drivers.png');
            background-size: cover;
            background-position: top center;
            border-bottom: 2px solid var(--f1-red);
            position: relative;
        }
        
        .main-logo {
            max-width: 280px;
            margin-bottom: 20px;
            filter: drop-shadow(0px 4px 15px rgba(0,0,0,0.8));
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        
        .back-btn {
            position: absolute;
            top: 25px;
            left: 25px;
            color: #ccc;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            background: rgba(255,255,255,0.05);
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }
        
        .back-btn:hover { 
            color: #fff; 
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .hero h1 {
            font-family: 'Formula1', sans-serif;
            font-size: 55px;
            text-transform: uppercase;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.9);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 50px 20px 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* MODERN TAB / BUTTON SYSTEM */
        .action-tabs {
            display: flex;
            gap: 25px;
            width: 100%;
            margin-bottom: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            min-width: 280px;
            max-width: 450px;
            padding: 20px 25px;
            font-family: 'Titillium Web', sans-serif;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #fff;
            background: rgba(31, 31, 39, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-align: center;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-top: 4px solid var(--btn-color, #444);
            border-left: 1px solid rgba(255,255,255,0.05);
            border-right: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .tab-btn.active {
            --btn-color: var(--f1-red);
            background: color-mix(in srgb, var(--btn-color) 15%, rgba(42, 42, 53, 0.95));
            box-shadow: 0 15px 40px color-mix(in srgb, var(--btn-color) 30%, transparent);
            border-color: var(--btn-color);
        }

        .tab-btn:hover {
            transform: translateY(-5px);
            --btn-color: #00bfff; /* Glows blue on hover */
            background: color-mix(in srgb, var(--btn-color) 15%, rgba(42, 42, 53, 0.95));
            box-shadow: 0 15px 40px color-mix(in srgb, var(--btn-color) 30%, transparent);
            border-color: var(--btn-color);
        }
        
        .tab-btn.active:hover {
            --btn-color: var(--f1-red); /* Keeps the active tab red on hover */
        }

        /* PDF VIEWER - HIDDEN BY DEFAULT */
        .pdf-container {
            width: 100%;
            height: 75vh;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            background: #fff; 
            display: none; /* Keeps it collapsed initially */
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 768px) {
            .hero { padding: 90px 15px 100px 15px; }
            .hero h1 { font-size: 35px; }
            .main-logo { max-width: 200px; }
            .back-btn { top: 15px; left: 15px; padding: 8px 12px; font-size: 13px; }
            .container { padding: 30px 15px 50px 15px; }
            .action-tabs { flex-direction: column; gap: 15px; align-items: center; }
            .tab-btn { width: 100%; padding: 15px; font-size: 16px; }
            .pdf-container { height: 65vh; }
        }
    </style>
</head>
<body>

    <header class="hero">
        <a href="index.html" class="back-btn">&#8592; Back</a>
        <a href="index.html">
            <img src="https://raw.githubusercontent.com/f1ladsleague/landing-page/main/Team_Photos/Logo.png" alt="F1 Lads Logo" class="main-logo">
        </a>
        <h1>Rules & Regulations</h1>
    </header>

    <div class="container">
        
        <div class="action-tabs">
            <div class="tab-btn" id="guidelines-btn" style="--btn-color: #444;">
                <span>📄</span> Season 5 Official Guidelines
            </div>
            <a href="https://trade.f1lads.com" target="_blank" class="tab-btn" style="--btn-color: #444;">
                <span>🔄</span> Mid-Season Trade Window
            </a>
        </div>

        <div class="pdf-container" id="pdf-viewer">
            <iframe id="pdf-iframe" data-src="https://docs.google.com/gview?url=https://raw.githubusercontent.com/f1ladsleague/landing-page/main/F1%20Lads%20League%20-%20Guidelines%20(Season%205).pdf&embedded=true"></iframe>
        </div>

    </div>

    <script>
        const guidelinesBtn = document.getElementById('guidelines-btn');
        const pdfViewer = document.getElementById('pdf-viewer');
        const pdfIframe = document.getElementById('pdf-iframe');

        guidelinesBtn.addEventListener('click', function() {
            // Toggle the active state of the button
            this.classList.toggle('active');

            if (this.classList.contains('active')) {
                // If it's now active, show the PDF container
                pdfViewer.style.display = 'block';
                
                // A tiny delay ensures the CSS fade-in animation triggers properly
                setTimeout(() => {
                    pdfViewer.style.opacity = '1';
                }, 10);

                // Load the PDF source ONLY if it hasn't been loaded yet
                if (!pdfIframe.src || pdfIframe.src === window.location.href) {
                    pdfIframe.src = pdfIframe.getAttribute('data-src');
                }
            } else {
                // If clicked again to close, fade it out first
                pdfViewer.style.opacity = '0';
                
                // Wait for the fade animation to finish before removing it from the page layout
                setTimeout(() => {
                    pdfViewer.style.display = 'none';
                }, 400); // 400ms matches the CSS transition time
            }
        });
    </script>
</body>
</html>
