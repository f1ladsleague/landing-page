<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rules & Regulations | F1 Lads</title>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Formula1';
            src: url('https://raw.githubusercontent.com/f1ladsleague/landing-page/main/Formula1.ttf') format('truetype');
        }

        :root { 
            --f1-red: #e10600; 
            --f1-dark: #15151e; 
            --f1-card: #1f1f27;
            --f1-hover: #2a2a35;
        }
        
        body { 
            font-family: 'Titillium Web', sans-serif; 
            color: #fff; 
            margin: 0; 
            padding: 0; 
            background-color: var(--f1-dark);
            background-image: linear-gradient(rgba(21, 21, 30, 0.90), rgba(21, 21, 30, 0.95)), url('https://raw.githubusercontent.com/f1ladsleague/landing-page/main/Team_Photos/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* CONSISTENT CINEMATIC HEADER */
        .header {
            text-align: center;
            padding: 130px 20px 150px 20px;
            background: linear-gradient(180deg, rgba(21, 21, 30, 0.4) 0%, rgba(21, 21, 30, 0.95) 100%), url('https://raw.githubusercontent.com/f1ladsleague/landing-page/main/Team_Photos/Drivers.png');
            background-size: cover;
            background-position: top center;
            border-bottom: 2px solid var(--f1-red);
            position: relative;
        }
        
        .main-logo {
            max-width: 280px;
            margin-bottom: 20px;
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.5));
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #aaa;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            text-transform: uppercase;
            transition: 0.2s;
            background: rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 4px;
        }
        
        .back-btn:hover { 
            color: #fff; 
            background: rgba(255,255,255,0.2); 
        }

        .header h1 {
            font-family: 'Formula1', sans-serif;
            font-size: 40px;
            text-transform: uppercase;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* TAB / BUTTON SYSTEM */
        .action-tabs {
            display: flex;
            gap: 20px;
            width: 100%;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            min-width: 280px;
            max-width: 400px;
            padding: 15px 20px;
            font-family: 'Titillium Web', sans-serif;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            color: #fff;
            background: var(--f1-card);
            border: 2px solid #444;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .tab-btn.active {
            background: var(--f1-red);
            border-color: var(--f1-red);
            box-shadow: 0 4px 20px rgba(225,6,0,0.4);
        }

        .tab-btn:hover {
            border-color: var(--f1-red);
            transform: translateY(-2px);
        }

        /* PDF VIEWER */
        .pdf-container {
            width: 100%;
            height: 75vh;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
            background: #fff; 
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="back-btn">&#8592; Back Home</a>
        <a href="index.html">
            <img src="https://raw.githubusercontent.com/f1ladsleague/landing-page/main/Team_Photos/Logo.png" alt="F1 Lads Logo" class="main-logo">
        </a>
        <h1>Rules & Regulations</h1>
    </header>

    <div class="container">
        
        <div class="action-tabs">
            <div class="tab-btn active">
                📄 Season 5 Official Guidelines
            </div>
            <a href="https://trade.f1lads.com" target="_blank" class="tab-btn">
                🔄 Mid-Season Trade Window
            </a>
        </div>

        <div class="pdf-container">
            <iframe src="https://docs.google.com/gview?url=https://raw.githubusercontent.com/f1ladsleague/landing-page/main/F1%20Lads%20League%20-%20Guidelines%20(Season%205).pdf&embedded=true"></iframe>
        </div>

    </div>

</body>
</html>
