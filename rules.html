<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rules & Regulations | F1 Lads</title>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --f1-red: #e10600; 
            --f1-dark: #15151e; 
        }
        
        body { 
            font-family: 'Titillium Web', sans-serif; 
            color: #fff; 
            margin: 0; 
            padding: 0; 
            background-color: var(--f1-dark);
            background-image: linear-gradient(rgba(21, 21, 30, 0.90), rgba(21, 21, 30, 0.95)), url('https://raw.githubusercontent.com/f1ladsleague/landing-page/6770fcc6c86dd4eaa46daa0af61a0c6293152c92/Team_Photos/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .header {
            text-align: center;
            padding: 30px 20px;
            border-bottom: 2px solid var(--f1-red);
            background: rgba(0,0,0,0.5);
            position: relative;
        }
        
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #aaa;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            text-transform: uppercase;
            transition: 0.2s;
            background: rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 4px;
        }
        .back-btn:hover { color: #fff; background: rgba(255,255,255,0.2); }

        .header h1 {
            font-size: 36px;
            text-transform: uppercase;
            margin: 0;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .trade-regs-btn {
            display: inline-block;
            background: var(--f1-red);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 6px;
            margin-bottom: 30px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(225,6,0,0.4);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .trade-regs-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(225,6,0,0.6);
            filter: brightness(1.1);
        }

        .pdf-container {
            width: 100%;
            height: 80vh; /* Takes up 80% of the screen height */
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
            background: #fff; /* White backing for PDF loader */
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="back-btn">&#8592; Back Home</a>
        <h1>Rules & Regulations</h1>
    </header>

    <div class="container">
        
        <a href="https://trade.f1lads.com" class="trade-regs-btn">
            🔄 Open Trade Regulations Platform
        </a>

        <div class="pdf-container">
            <iframe src="https://docs.google.com/gview?url=https://raw.githubusercontent.com/f1ladsleague/landing-page/756d3bc871d251b1bad9277a6ed5c01ed1d5c3bc/F1%20Lads%20League%20-%20Guidelines%20(Season%205).pdf&embedded=true"></iframe>
        </div>

    </div>

</body>
</html>
