<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Results | F1 Lads League</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/f1ladsleague/sidebetting/6f14ca658f9c288fd8ca8a79df5c658c97c8ac92/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --f1-red: #e10600; 
            --f1-dark: #15151e; 
            --f1-card: #1f1f27;
            --ferrari: #ef1a2d;
            --mclaren: #ff8000;
            --mercedes: #00d2be;
            --aston: #006f62;
            --redbull: #3671c6;
            --fastest-lap: #ae37de; 
        }
        
        body { 
            font-family: 'Titillium Web', sans-serif; 
            background-color: var(--f1-dark); 
            background-image: linear-gradient(rgba(21, 21, 30, 0.95), rgba(21, 21, 30, 0.98)), url('https://raw.githubusercontent.com/f1ladsleague/landing-page/main/Team_Photos/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            overflow-y: scroll;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* BRAND HEADER */
        .top-brand-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .page-logo {
            max-width: 220px;
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.5));
            margin-bottom: 5px;
            transition: transform 0.3s ease;
        }
        .page-logo:hover {
            transform: scale(1.05);
        }
        .page-main-title {
            font-size: 42px;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            margin: 0;
            text-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        /* CROSS-LINKING STYLES */
        .link-hover {
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            transition: color 0.2s ease, transform 0.2s ease;
            display: inline-flex;
            align-items: center;
        }
        .link-hover:hover {
            color: var(--f1-red) !important;
        }
        .driver-cell.link-hover:hover .driver-col {
            color: var(--f1-red);
        }
        .driver-cell.link-hover:hover .driver-photo-wrapper {
            border-color: #fff;
            transform: scale(1.05);
        }

        /* HEADER & NAVIGATION */
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; border-bottom: 2px solid #333; padding-bottom: 20px; flex-wrap: wrap; gap: 15px;}
        .header-left { display: flex; align-items: center; min-width: 0; flex: 1; }
        .header-right { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        
        .back-btn { background: #333; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: 700; transition: 0.3s; margin-right: 20px; text-transform: uppercase; white-space: nowrap;}
        .back-btn:hover { background: var(--f1-red); transform: translateX(-3px); }
        
        .title-wrapper h2 { margin: 0; font-size: 24px; text-transform: uppercase; font-weight: 900; letter-spacing: 1px; color: var(--f1-red); display: flex; align-items: center; gap: 10px;}
        .title-wrapper p { margin: 5px 0 0 0; color: #aaa; font-size: 15px; }

        .track-flag { height: 24px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        /* DROPDOWN SELECTOR */
        .race-selector {
            background: var(--f1-card);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 20px;
            font-family: 'Titillium Web', sans-serif;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            transition: 0.3s;
            max-width: 400px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .race-selector:hover { border-color: var(--f1-red); }
        .race-selector:focus { border-color: var(--f1-red); box-shadow: 0 0 10px rgba(225, 6, 0, 0.3); }

        /* TABS */
        .session-tabs { display: flex; gap: 15px; margin-bottom: 20px; }
        .tab-btn {
            background: rgba(255,255,255,0.05); color: #888; border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 25px; border-radius: 6px; font-size: 16px; font-weight: 700;
            text-transform: uppercase; cursor: pointer; transition: 0.3s; flex: 1; text-align: center;
        }
        .tab-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); color: #fff; }
        .tab-btn.active { background: var(--f1-red); color: #fff; border-color: var(--f1-red); box-shadow: 0 4px 15px rgba(225, 6, 0, 0.4); }
        .tab-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* RESULTS TABLE */
        .results-wrapper {
            background: var(--f1-card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(0,0,0,0.4); padding: 15px 20px; color: #888; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; font-weight: 700; border-bottom: 1px solid #333; }
        td { padding: 12px 20px; border-bottom: 1px solid #2a2a35; font-size: 16px; font-weight: 600; vertical-align: middle; transition: background 0.2s; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }

        /* FASTEST LAP PURPLE ROW OVERRIDE */
        .fl-row td { color: var(--fastest-lap) !important; }
        .fl-row .pos-col, .fl-row .pts-col, .fl-row .team-text { color: var(--fastest-lap) !important; }

        /* SPECIFIC COLUMNS */
        .pos-col { width: 50px; text-align: center; font-weight: 900; font-size: 18px; color: #aaa; }
        
        .driver-cell { display: inline-flex; align-items: center; gap: 15px; }
        
        /* ZOOMED DRIVER PHOTO WRAPPER */
        .driver-photo-wrapper {
            width: 45px; height: 45px; border-radius: 50%; overflow: hidden; 
            border: 2px solid #444; background: #222; flex-shrink: 0;
            display: flex; align-items: flex-start; justify-content: center;
            transition: 0.2s ease;
        }
        .driver-photo { 
            width: 100%; height: 100%; 
            object-fit: cover; 
            object-position: center top; 
            transform-origin: top center; 
            transform: scale(1.6); 
        }
        
        .driver-col { font-size: 18px; font-weight: 700; text-transform: uppercase; margin: 0; transition: color 0.2s ease; }
        
        .team-cell { display: flex; align-items: center; gap: 10px; }
        .team-logo { width: 35px; height: 35px; object-fit: contain; }
        .team-text { color: #ccc; font-size: 14px; text-transform: uppercase; }

        .time-col { font-family: monospace; font-size: 15px; letter-spacing: 0.5px; }
        .pts-col { font-weight: 900; color: var(--f1-red); text-align: center; font-size: 18px; }
        
        .dnf-text { color: #888; font-style: italic; }

        /* LOADER */
        #loader { text-align: center; padding: 50px; color: #888; font-style: italic; }

        /* DISCRETE ARCHIVE FOOTER */
        .archive-footer { text-align: center; margin-top: 40px; padding-bottom: 20px; }
        .archive-footer a { color: var(--f1-red); text-decoration: none; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        .archive-footer a:hover { color: #fff; }
        
        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            .header-left { width: 100%; margin-bottom: 10px; }
            .header-right { width: 100%; flex-direction: column; align-items: stretch; }
            .race-selector { width: 100%; max-width: 100%; }
            th, td { padding: 10px 10px; font-size: 14px; }
            .hide-mobile { display: none; }
            .driver-col { font-size: 15px; }
            .time-col { font-size: 13px; }
            .driver-photo-wrapper { width: 35px; height: 35px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-brand-header">
            <a href="index.html">
                <img src="https://raw.githubusercontent.com/f1ladsleague/landing-page/main/Team_Photos/Logo.png" alt="F1 Lads Logo" class="page-logo">
            </a>
            <h1 class="page-main-title">Race Results</h1>
        </div>

        <div class="header">
            <div class="header-left">
                <a href="index.html" class="back-btn">❮ Back</a>
                <div class="title-wrapper">
                    <h2 id="race-title-container">Loading...</h2>
                    <p id="race-subtitle">Fetching telemetry data.</p>
                </div>
            </div>
            
            <div class="header-right">
                <select id="race-selector" class="race-selector" style="display: none;"></select>
            </div>
        </div>

        <div class="session-tabs" id="session-tabs" style="display: none;">
            <button id="tab-quali" class="tab-btn" onclick="switchSession('Qualification')">Qualification</button>
            <button id="tab-race" class="tab-btn" onclick="switchSession('Race')">Race</button>
        </div>

        <div class="results-wrapper">
            <div id="loader">Compiling historical race data...</div>
            <table id="results-table" style="display: none;">
                <thead id="table-head"></thead>
                <tbody id="results-body"></tbody>
            </table>
        </div>
        
        <div class="archive-footer">
            <a href="archive.html">View Previous Seasons</a>
        </div>
    </div> 
    
    <script>
        // ASSETS MAPPING
        const photoBase = "https://raw.githubusercontent.com/f1ladsleague/landing-page/main/Team_Photos/";
        const teamLogos = {
            "Aston Martin": "AM.png",
            "Ferrari": "FER.png",
            "McLaren": "MCL.png",
            "Mercedes": "MER.png",
            "Red Bull": "RB.png"
        };
        const teamColors = {
            "Ferrari": "var(--ferrari)",
            "McLaren": "var(--mclaren)",
            "Mercedes": "var(--mercedes)",
            "Aston Martin": "var(--aston)",
            "Red Bull": "var(--redbull)"
        };
        
        const trackCountryFlags = {
            "Bahrain": "bahrain", "Jeddah": "saudi_arabia", "Melbourne": "australia", 
            "Baku": "azerbaijan", "Miami": "united_states_of_america", "Imola": "italy", 
            "Monaco": "monaco", "Barcelona": "spain", "Spielberg": "austria", 
            "Silverstone": "great_britain", "Hungaroring": "hungary", "Spa": "belgium", 
            "Zandvoort": "netherlands", "Monza": "italy", "Singapore": "singapore", 
            "Suzuka": "japan", "Losail": "qatar", "Austin": "united_states_of_america", 
            "Mexico": "mexico", "Interlagos": "brazil", "Las Vegas": "united_states_of_america", 
            "Yas Marina": "united_arab_emirates", "Shanghai": "china", "Montreal": "canada", "Portimão": "portugal", "Paul Ricard": "france"
        };

        function getTrackFlagUrl(trackName) {
            let cleanName = trackName === "Spa-Francorchamps" ? "Spa" : trackName;
            let fName = trackCountryFlags[cleanName];
            if (!fName) return "";
            return `${photoBase}${fName}.png`;
        }

        function formatMs(ms) {
            if (!ms || ms === 0) return "-";
            let totalSeconds = ms / 1000;
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = (totalSeconds % 60).toFixed(3);
            if (minutes > 0) return `${minutes}:${seconds.padStart(6, '0')}`;
            return seconds; 
        }

        function formatGap(ms) {
            let totalSeconds = ms / 1000;
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = (totalSeconds % 60).toFixed(3);
            if (minutes > 0) return `+${minutes}:${seconds.padStart(6, '0')}`;
            return `+${seconds}`;
        }

        // GLOBALS
        let groupedEvents = []; 
        let activeEventIndex = 0;
        let activeSession = "Race"; 
        const cacheBuster = `?v=${new Date().getTime()}`;

        // 1. FETCH & PROCESS DATA
        fetch(`https://raw.githubusercontent.com/f1ladsleague/standings/main/race_list.txt${cacheBuster}`)
            .then(res => {
                if (!res.ok) throw new Error("List not found");
                return res.text();
            })
            .then(async text => {
                const files = text.split('\n').map(f => f.trim()).filter(f => f.endsWith('.json'));
                if (files.length === 0) throw new Error("No race data found");

                const fetchPromises = files.map(file => 
                    fetch(`https://raw.githubusercontent.com/f1ladsleague/standings/main/${file}${cacheBuster}`).then(r => r.json())
                );
                const allRaceData = await Promise.all(fetchPromises);

                const races = allRaceData.filter(d => d.SessionType === "Race");
                const qualis = allRaceData.filter(d => d.SessionType === "Qualification");

                // 2. BUILD EVENTS
                races.forEach(race => {
                    const winner = race.Drivers.find(d => d.Position === 1);
                    let label = "Feature"; 
                    
                    if (winner) {
                        const truePoints = winner.DriverPointsRaw / 10;
                        if (truePoints <= 20) label = "Sprint";
                    }
                    
                    const matchingQuali = qualis.find(q => q.TrackName === race.TrackName);

                    groupedEvents.push({
                        trackName: race.TrackName,
                        label: label,
                        date: race.Date,
                        raceData: race,
                        qualiData: matchingQuali
                    });
                });

                // Sort Ascending: Oldest first. 
                // Tie-breaker: If dates are identical, force Sprint before Feature.
                groupedEvents.sort((a, b) => {
                    let dateDiff = new Date(a.date) - new Date(b.date);
                    if (dateDiff !== 0) return dateDiff;
                    
                    let order = { "Sprint": 1, "Feature": 2 };
                    let aOrder = order[a.label] || 3;
                    let bOrder = order[b.label] || 3;
                    return aOrder - bOrder;
                });

                // 3. POPULATE DROPDOWN
                const selector = document.getElementById('race-selector');
                groupedEvents.forEach((event, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    const dateStr = new Date(event.date).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
                    option.textContent = `${dateStr} - ${event.trackName} (${event.label})`;
                    selector.appendChild(option);
                });

                selector.style.display = "block";
                document.getElementById('session-tabs').style.display = "flex";

                selector.addEventListener('change', (e) => {
                    activeEventIndex = e.target.value;
                    activeSession = "Race"; 
                    updateUI();
                });

                updateUI();
            })
            .catch(err => {
                console.error("Fetch Error: ", err);
                document.getElementById('loader').innerText = "No race data has been uploaded yet or still syncing to GitHub.";
            });

        function switchSession(type) {
            activeSession = type;
            updateUI();
        }

        // RENDER THE CURRENT STATE
        function updateUI() {
            const event = groupedEvents[activeEventIndex];
            const data = activeSession === "Qualification" ? event.qualiData : event.raceData;
            const isQuali = activeSession === "Qualification";
            
            document.getElementById('tab-quali').disabled = !event.qualiData;
            document.getElementById('tab-quali').className = `tab-btn ${isQuali ? 'active' : ''}`;
            document.getElementById('tab-race').className = `tab-btn ${!isQuali ? 'active' : ''}`;

            if (!data) return; 

            document.getElementById('loader').style.display = "none";
            document.getElementById('results-table').style.display = "table";

            // Add Clickable Track Title & Flag
            let cleanTrackName = event.trackName === "Spa-Francorchamps" ? "Spa" : event.trackName;
            let flagUrl = getTrackFlagUrl(cleanTrackName);
            let flagHtml = flagUrl ? `<img src="${flagUrl}" class="track-flag" alt="Flag">` : '';
            
            document.getElementById('race-title-container').innerHTML = `
                <a href="statistics.html?track=${encodeURIComponent(cleanTrackName)}" class="link-hover" title="View ${cleanTrackName} Statistics">
                    ${flagHtml} ${event.trackName}
                </a>
            `;

            const raceDate = new Date(data.Date).toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
            let subtitlePrefix = isQuali ? 'Qualifying' : `${event.label} Race`;
            document.getElementById('race-subtitle').innerText = `${subtitlePrefix} Classification | ${raceDate}`;

            // BUILD HEADERS
            document.getElementById('table-head').innerHTML = `
                <tr>
                    <th class="pos-col">Pos</th>
                    <th>Driver</th>
                    <th class="hide-mobile">Constructor</th>
                    ${isQuali ? '' : '<th class="hide-mobile" style="text-align: center;">Grid</th>'}
                    ${isQuali ? '' : '<th class="hide-mobile" style="text-align: center;">Pits</th>'}
                    <th>${isQuali ? 'Best Lap' : 'Time / Gap'}</th>
                    ${isQuali ? '' : '<th class="hide-mobile">Fastest Lap</th>'}
                    ${isQuali ? '' : '<th class="pts-col">Pts</th>'}
                </tr>
            `;

            const tbody = document.getElementById('results-body');
            tbody.innerHTML = ""; 

            const drivers = data.Drivers.sort((a, b) => a.Position - b.Position);

            let winnerTime = 0;
            if (!isQuali) {
                const winner = drivers.find(d => d.Position === 1);
                if (winner) winnerTime = winner.TimeInt;
            }

            drivers.forEach(driver => {
                const isFastestLap = data.FastestLapDriver && data.FastestLapDriver.Name === driver.Driver.Name;
                
                const safeDriverName = driver.Driver.Name.replace(/\s+/g, '');
                const driverPhotoUrl = `${photoBase}${safeDriverName}.png`;
                
                const teamName = driver.Team ? driver.Team.Name : "Unknown";
                const teamLogoUrl = teamLogos[teamName] ? `${photoBase}${teamLogos[teamName]}` : '';
                const teamColor = teamColors[teamName] || '#222';

                let timeDisplay = "";
                
                if (isQuali) {
                    if (driver.FastestLapTimeInt === 0 || driver.Status === "Dsq" || driver.Status === "Dnf") {
                        timeDisplay = `<span class="dnf-text">${driver.Status === 'Dsq' ? 'DSQ' : 'NO TIME'}</span>`;
                    } else {
                        timeDisplay = formatMs(driver.FastestLapTimeInt);
                    }
                } else {
                    if (driver.Status !== "Ok" && driver.Status !== "finished") {
                        timeDisplay = `<span class="dnf-text">${driver.Status === 'Dsq' ? 'DSQ' : 'DNF'}</span>`;
                    } else if (driver.Position === 1) {
                        timeDisplay = formatMs(driver.TimeInt); 
                    } else if (driver.TimeInt > 0 && winnerTime > 0) {
                        timeDisplay = formatGap(driver.TimeInt - winnerTime);
                    } else if (driver.Status && driver.Status.toLowerCase().includes("lap")) {
                        timeDisplay = driver.Status; 
                    } else {
                        timeDisplay = `<span class="dnf-text">Unknown</span>`;
                    }
                }

                const truePoints = isQuali ? 0 : (driver.DriverPointsRaw / 10);

                const tr = document.createElement('tr');
                if (!isQuali && isFastestLap) {
                    tr.classList.add('fl-row');
                }

                let profileUrl = `statistics.html?driver=${encodeURIComponent(driver.Driver.Name)}`;

                tr.innerHTML = `
                    <td class="pos-col">${driver.Position}</td>
                    <td>
                        <a href="${profileUrl}" class="driver-cell link-hover" title="View ${driver.Driver.Name}'s Profile">
                            <div class="driver-photo-wrapper" style="background-color: ${teamColor};">
                                <img src="${driverPhotoUrl}" alt="${driver.Driver.Name}" class="driver-photo" onerror="this.parentElement.style.display='none'">
                            </div>
                            <span class="driver-col">${driver.Driver.Name}</span>
                        </a>
                    </td>
                    <td class="hide-mobile">
                        <div class="team-cell">
                            ${teamLogoUrl ? `<img src="${teamLogoUrl}" alt="${teamName}" class="team-logo">` : ''}
                            <span class="team-text">${teamName}</span>
                        </div>
                    </td>
                    ${isQuali ? '' : `<td class="hide-mobile" style="text-align: center;">${driver.GridPosition}</td>`}
                    ${isQuali ? '' : `<td class="hide-mobile" style="text-align: center;">${driver.PitsCount}</td>`}
                    <td class="time-col">${timeDisplay}</td>
                    ${isQuali ? '' : `<td class="time-col hide-mobile">
                        ${formatMs(driver.FastestLapTimeInt)}
                    </td>`}
                    ${isQuali ? '' : `<td class="pts-col">${truePoints}</td>`}
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
