<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/f1ladsleague/sidebetting/6f14ca658f9c288fd8ca8a79df5c658c97c8ac92/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root { --f1-red: #e10600; --f1-dark: #15151e; --f1-card: #1f1f27; --ferrari: #ef1a2d; --mclaren: #ff8000; --mercedes: #00d2be; --aston: #006f62; --redbull: #3671c6; --alpine: #0090ff; --alfaromeo: #900000; --alphatauri: #2b4562; --fastest-lap: #ae37de; }
        body { font-family: 'Titillium Web', sans-serif; background-color: var(--f1-dark); background-image: linear-gradient(rgba(21, 21, 30, 0.95), rgba(21, 21, 30, 0.98)), url('https://raw.githubusercontent.com/f1ladsleague/landing-page/main/Team_Photos/background.jpg'); background-size: cover; background-position: center; background-attachment: fixed; color: #fff; margin: 0; padding: 20px; overflow-y: scroll; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .top-brand-header { text-align: center; margin-bottom: 25px; }
        .page-logo { max-width: 220px; filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.5)); transition: transform 0.3s ease; }
        .page-logo:hover { transform: scale(1.05); }
        .page-main-title { font-size: 42px; text-transform: uppercase; font-weight: 900; letter-spacing: 2px; color: #fff; margin: 10px 0 0 0; text-shadow: 0 4px 10px rgba(0,0,0,0.6); }
        .page-subtitle { color: var(--f1-red); font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; margin: 0; }

        /* Navigation Tabs */
        .stat-nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 15px; flex-wrap: wrap;}

        .stat-tab:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .stat-tab.active { background: var(--f1-red); color: #fff; border-color: var(--f1-red); box-shadow: 0 4px 15px rgba(225, 6, 0, 0.4); }

        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Directory UI */
        .directory-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; }
        .directory-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; text-decoration: none; color: inherit; display: block; }
        .directory-card:hover { background: rgba(255,255,255,0.08); border-color: var(--f1-red); transform: translateY(-5px); }
        .directory-photo { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; object-position: center top; border: 3px solid #444; margin-bottom: 15px; transition: 0.3s; }
        .directory-card:hover .directory-photo { border-color: #fff; }
        .directory-name { font-size: 20px; font-weight: 900; text-transform: uppercase; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .directory-sub { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }

        .data-card { background: rgba(0,0,0,0.4); border: 1px solid #333; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; }
        .data-card:hover { border-color: var(--f1-red); background: rgba(225,6,0,0.1); }
        .data-card-title { font-size: 22px; font-weight: 900; text-transform: uppercase; margin: 0 0 10px 0; color: #fff; }
        .data-card-stat { font-size: 14px; color: #aaa; }

        /* Profile UI */
        .profile-wrapper { background: var(--f1-card); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .profile-header { display: flex; align-items: center; gap: 25px; padding: 30px; background: rgba(0,0,0,0.4); border-bottom: 1px solid #333; flex-wrap: wrap; position: relative;}
        .profile-photo { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; object-position: center top; border: 4px solid #444; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .profile-info { flex: 1; }
        .profile-name { font-size: 42px; font-weight: 900; text-transform: uppercase; margin: 0; letter-spacing: 1px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;}
        
        .flag-icon { height: 28px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .team-logo-main { height: 45px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); margin-left: 5px; }
        .rookie-badge { background: #00d2be; color: #000; font-size: 12px; font-weight: 900; padding: 4px 10px; border-radius: 4px; letter-spacing: 1px; vertical-align: middle; }
        
        .profile-meta { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px; color: #aaa; font-size: 14px; align-items: center;}
        .meta-tag { background: rgba(255,255,255,0.05); padding: 5px 12px; border-radius: 4px; font-weight: 700; text-transform: uppercase; font-size: 12px; border: 1px solid rgba(255,255,255,0.1); }
        
        .former-teams { display: flex; gap: 10px; align-items: center; margin-top: 15px; font-size: 12px; color: #888; text-transform: uppercase; font-weight: 700; letter-spacing: 1px;}
        .former-team-logo { height: 30px; object-fit: contain; opacity: 0.6; transition: 0.3s; }

        .back-btn { position: absolute; top: 20px; right: 20px; background: #333; color: #fff; text-decoration: none; padding: 8px 20px; border-radius: 6px; font-weight: 700; border: none; cursor: pointer; transition: 0.3s; font-family: 'Titillium Web'; text-transform: uppercase;}
        .back-btn:hover { background: var(--f1-red); }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: #333; border-bottom: 1px solid #333;}
        .stat-box { background: var(--f1-card); padding: 25px 15px; text-align: center; display: flex; flex-direction: column; justify-content: center;}
        .stat-value { font-size: 32px; font-weight: 900; color: #fff; line-height: 1; }
        .stat-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-top: 10px; }
        .stat-value.text-value { font-size: 20px; word-break: break-word; color: #ddd; }

        /* Charts Section */
        .charts-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 30px; background: rgba(0,0,0,0.2); }
        .chart-container { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; }
        .chart-title { font-size: 16px; color: #aaa; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin-top: 0; text-align: center; margin-bottom: 15px; }

        /* Accordion Season History */
        .history-section { padding: 30px; }
        .history-title { font-size: 24px; font-weight: 900; text-transform: uppercase; color: var(--f1-red); margin-top: 0; margin-bottom: 20px; }
        details { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; margin-bottom: 15px; overflow: hidden; }
        summary { padding: 20px; font-size: 18px; font-weight: 900; text-transform: uppercase; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        summary::-webkit-details-marker { display: none; }
        summary:hover { background: rgba(255,255,255,0.05); }
        .summary-stats { font-size: 14px; color: #aaa; font-weight: 700; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(0,0,0,0.6); padding: 12px 20px; color: #888; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; border-bottom: 1px solid #333; }
        td { padding: 12px 20px; border-bottom: 1px solid #2a2a35; font-size: 15px; font-weight: 600; color: #ddd;}
        tr:last-child td { border-bottom: none; }

        /* Analysis Tables */
        .analysis-table th { background: var(--f1-red); color: #fff; }
        .analysis-table td { background: rgba(0,0,0,0.2); }
        .analysis-table tr:hover td { background: rgba(255,255,255,0.05); }

        /* EXACT CUSTOM MODAL FOR EA RACENET FROM LANDING PAGE */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background: var(--f1-card); border-radius: 12px; padding: 30px 25px;
            max-width: 400px; width: 90%; text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8);
            border-top: 5px solid #ff4747; position: relative;
            transform: translateY(20px); transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        
        .modal-close {
            position: absolute; top: 15px; right: 15px; background: none; border: none;
            color: #888; font-size: 28px; cursor: pointer; transition: 0.2s; line-height: 1;
        }
        .modal-close:hover { color: var(--f1-red); }
        
        .modal-content h3 { margin: 10px 0 5px 0; font-size: 24px; text-transform: uppercase; font-weight: 900; color: #fff; }
        .modal-content p { color: #aaa; font-size: 14px; margin-bottom: 25px; line-height: 1.4; }
        
        .cred-group { margin-bottom: 12px; text-align: left; background: rgba(0,0,0,0.4); padding: 12px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .cred-label { display: block; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; font-weight: 700; }
        .cred-row { display: flex; justify-content: space-between; align-items: center; }
        .cred-value { font-family: monospace; font-size: 15px; color: #fff; font-weight: 700; letter-spacing: 0.5px; user-select: all; }
        
        .copy-btn {
            background: #333; color: #fff; border: none; padding: 6px 12px; border-radius: 4px;
            cursor: pointer; font-size: 11px; font-weight: 700; transition: 0.2s; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .copy-btn:hover { background: #555; }
        .copy-btn.success { background: #00d7b6; color: #000; }
        
        .proceed-btn {
            display: inline-block; margin-top: 15px; background: #ff4747; color: #fff; text-decoration: none;
            padding: 14px 25px; border-radius: 6px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
            width: 100%; box-sizing: border-box; transition: 0.3s;
        }
        .proceed-btn:hover { background: #ff1a1a; box-shadow: 0 5px 15px rgba(255, 71, 71, 0.4); transform: translateY(-2px); }

        #loader { text-align: center; padding: 50px; font-size: 18px; color: #aaa; font-style: italic; }

        @media (max-width: 1000px) {
            .directory-grid { grid-template-columns: repeat(3, 1fr); }
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .directory-grid { grid-template-columns: repeat(2, 1fr); }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .profile-header { flex-direction: column; text-align: center; }
            .profile-name { justify-content: center; font-size: 32px; flex-wrap: wrap;}
            .profile-meta { justify-content: center; }
            .former-teams { justify-content: center; }
            .back-btn { position: relative; top: 0; right: 0; width: 100%; margin-bottom: 15px; }
            .charts-section { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-brand-header">
            <a href="index.html"><img src="https://raw.githubusercontent.com/f1ladsleague/landing-page/main/Team_Photos/Logo.png" alt="F1 Lads Logo" class="page-logo"></a>

                <span class="cred-label">Password</span>

                    <span class="cred-value" id="rn-pass">madhawamaPa!23</span>
                    <button class="copy-btn" onclick="copyText('rn-pass', this)">Copy</button>

            <a href="https://racenet.com/" target="_blank" class="proceed-btn">Proceed to Racenet ❯</a>

    </div>

    <script>
        const photoBase = "https://raw.githubusercontent.com/f1ladsleague/landing-page/main/Team_Photos/";
        const teamColors = { "Ferrari": "#ef1a2d", "McLaren": "#ff8000", "Mercedes": "#00d2be", "Aston Martin": "#006f62", "Red Bull": "#3671c6", "Alpine": "#0090ff", "Alfa Romeo": "#900000", "AlphaTauri": "#2b4562", "RB": "#1a3eb8", "Kick Sauber": "#00e701", "Williams": "#005aff", "Haas": "#ffffff" };
        
        let allEvents = [];
        let driverProfiles = {}; 
        let driverStats = {};    
        let trackStats = {};
        let seasonStandings = {};
        let currentSeasonMax = 1;
        
        let myChart1, myChart2, myChart3;

        // HARDCODED DRIVERS JSON
        const staticDriverProfiles = [
          { "Name": "Mapa", "RealName": "Madhawa Mapa", "InGameName": "M. MAPA", "Nationality": "United Arab Emirates", "RaceNumber": 99, "GamePlatform": "PC" },
          { "Name": "Shiyan", "RealName": "Shiyan Kekulkotuwage", "InGameName": "shiyank88", "RaceNumber": 8, "GamePlatform": "PC" },
          { "Name": "Nuwie G", "RealName": "Nuwantha Gamage", "InGameName": "Nuwie_G", "Nationality": "Saudi Arabia", "RaceNumber": 11, "GamePlatform": "PS5" },
          { "Name": "Shahan", "RealName": "Shahan Withanage", "InGameName": "ShahanW", "Nationality": "Pakistan", "RaceNumber": 13, "GamePlatform": "PS5" },
          { "Name": "Sameera", "RealName": "Sameera Malimbada", "InGameName": "S. Malimbada", "Nationality": "Sri Lanka", "RaceNumber": 98, "GamePlatform": "PC" },
          { "Name": "Sahan", "RealName": "Sahan Wimalagunaratna", "InGameName": "Laforet", "RaceNumber": 15, "GamePlatform": "PC" },
          { "Name": "Nippa E", "RealName": "Nippa Ekanayake", "InGameName": "Racer4965", "Nationality": "Fiji", "RaceNumber": 69, "GamePlatform": "PS5" },
          { "Name": "Eranga", "RealName": "Eranga Pelpola", "InGameName": "BiGDaddyE3002", "RaceNumber": 91, "GamePlatform": "Xbox" },
          { "Name": "Rodda", "RealName": "Nuwi Rodrigo", "InGameName": "NuwiRODDA", "Nationality": "Germany", "RaceNumber": 92, "GamePlatform": "PS5" },
          { "Name": "Kalpa", "RealName": "Kalpa Keragala", "InGameName": "PrODigY_v2", "Nationality": "Brazil", "RaceNumber": 88, "GamePlatform": "PS5" }
        ];

        // AWARDS DICTIONARY
        const driverAwards = {
            "Rodda": ["Season 4 - Cleanest Driver", "Season 4 - Drivers MVP", "Season 4 - Overtake of the Season"],
            "Kalpa": ["Season 4 - Most Improved Driver"]
        };

        const archiveFiles = [
            "Season%201/results_silverstone_race.json", "Season%201/results_spielberg_race.json", "Season%201/results_bahrain_race.json", "Season%201/results_jeddah_race.json", "Season%201/results_melbourne_race.json", "Season%201/results_suzuka_race.json",
            "Season%202/results_miami_race.json", "Season%202/results_imola_race.json", "Season%202/results_monza_race.json", "Season%202/results_spa-francorchamps_race.json", "Season%202/results_barcelona_race.json", "Season%202/results_baku_race.json", "Season%202/results_losail_race.json", "Season%202/results_hungaroring_race.json", "Season%202/results_singapore_race.json",
            "Season%203/results_imola_race.json", "Season%203/results_shanghai_sprint.json", "Season%203/results_shanghai_race.json", "Season%203/results_austin_sprint.json", "Season%203/results_austin_race.json", "Season%203/results_zandvoort_race.json", "Season%203/results_mexico_race.json", "Season%203/results_interlagos_sprint.json", "Season%203/results_interlagos_race.json", "Season%203/results_las%20vegas_race.json", "Season%203/results_yas%20marina_race.json"
        ];
        const cacheBuster = `?v=${new Date().getTime()}`;

        function formatMs(ms) {
            if (!ms || ms === 0) return "-";
            let totalSeconds = ms / 1000;
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = (totalSeconds % 60).toFixed(3);
            if (minutes > 0) return `${minutes}:${seconds.padStart(6, '0')}`;
            return seconds; 
        }

        function formatGap(ms) {
            if (!ms || ms === 0) return "Winner";
            let totalSeconds = ms / 1000;
            let minutes = Math.floor(totalSeconds / 60);
            let seconds = (totalSeconds % 60).toFixed(3);
            if (minutes > 0) return `+${minutes}:${seconds.padStart(6, '0')}`;
            return `+${seconds}`;
        }

        // EXACT EA MODAL JS
        function openRacenet(event) {
            event.preventDefault(); 
            document.getElementById('racenet-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('racenet-modal').classList.remove('active');
        }

        function copyText(elementId, btnElement) {
            const textToCopy = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btnElement.innerText;
                btnElement.innerText = "COPIED!";
                btnElement.classList.add('success');
                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.classList.remove('success');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
                alert("Failed to copy. Please manually select the text.");
            });
        }

        async function initData() {
            try {
                // Initialize static driver profiles first
                staticDriverProfiles.forEach(d => driverProfiles[d.Name] = d);

                // Live files fetch
                let liveFiles = [];
                const listRes = await fetch(`https://raw.githubusercontent.com/f1ladsleague/standings/main/race_list.txt${cacheBuster}`);
                if (listRes.ok) {
                    const text = await listRes.text();
                    liveFiles = text.split('\n').map(f => f.trim()).filter(f => f.endsWith('.json'));
                }

                const allFilePaths = [...archiveFiles, ...liveFiles];
                const fetchPromises = allFilePaths.map(file => fetch(`https://raw.githubusercontent.com/f1ladsleague/standings/main/${file}${cacheBuster}`).then(r => r.ok ? r.json().then(data => ({ data, path: file })) : null));
                
                const results = await Promise.all(fetchPromises);
                const validFiles = results.filter(r => r !== null);
                
                // Track all sessions (Race + Sprints)
                const racesAndSprints = validFiles.filter(f => f.data.SessionType === "Race");

                racesAndSprints.forEach(fileObj => {
                    const race = fileObj.data; const path = fileObj.path;
                    let dateObj = new Date(race.Date);
                    
                    let seasonNum = 5; 
                    if (path.includes("Season%201")) seasonNum = 1;
                    else if (path.includes("Season%202")) seasonNum = 2;
                    else if (path.includes("Season%203")) seasonNum = 3;
                    else if (dateObj.getFullYear() < 2026 && !path.includes("results_")) seasonNum = 4;
                    
                    if (seasonNum > currentSeasonMax) currentSeasonMax = seasonNum;

                    let maxPts = Math.max(0, ...race.Drivers.map(d => (d.DriverPointsRaw || 0) / 10));
                    let label = "Feature"; 
                    if (seasonNum === 3 && maxPts <= 10) label = "Sprint";
                    else if (seasonNum !== 3 && maxPts <= 16) label = "Sprint";
                    
                    if (race.RaceType === "Sprint") label = "Sprint";

                    allEvents.push({ season: seasonNum, trackName: race.TrackName, label: label, date: dateObj, raceData: race });
                });

                allEvents.sort((a, b) => a.date - b.date);
                computeStatistics();

                document.getElementById('loader').style.display = "none";
                document.getElementById('main-nav').style.display = "flex";

                renderDirectory();

            } catch (err) {
                console.error(err);
                document.getElementById('loader').innerText = "Error syncing database.";
            }
        }

        function computeStatistics() {
            allEvents.forEach((ev) => {
                let tNameStr = ev.trackName;
                
                // Initialize Track Stats to hold ALL sessions
                if (!trackStats[tNameStr]) trackStats[tNameStr] = { 
                    name: tNameStr, 
                    races: 0, 
                    sessions: [],
                    driverPoints: {},
                    driverWins: {},
                    lapRecord: { time: 999999999, driver: "-" }
                };
                
                // Increment overall track race counter if it's a Feature race
                if (ev.label === "Feature") trackStats[tNameStr].races++;
                trackStats[tNameStr].sessions.push(ev);

                if (!seasonStandings[ev.season]) seasonStandings[ev.season] = { drivers: {}, teams: {} };
                
                let winnerTime = ev.raceData.Drivers.find(d => d.Position === 1)?.TimeInt || 0;

                ev.raceData.Drivers.forEach(d => {
                    let dName = d.Driver.Name;
                    let tName = d.Team ? d.Team.Name : "Unknown";
                    let pts = (d.DriverPointsRaw / 10) || 0;
                    let pos = d.Position;
                    let penPts = d.PenaltyPoints || 0;
                    let isFL = ev.raceData.FastestLapDriver && ev.raceData.FastestLapDriver.Name === dName;
                    let flTime = d.FastestLapTimeInt || 0;
                    let isDnf = (d.Status !== "Ok" && d.Status !== "finished" && !d.Status.toLowerCase().includes("lap"));
                    
                    let gapStr = "-";
                    if (isDnf) gapStr = "DNF";
                    else if (pos === 1) gapStr = "Winner";
                    else if (d.TimeInt > 0 && winnerTime > 0) gapStr = formatGap(d.TimeInt - winnerTime);
                    else if (d.Status && d.Status.toLowerCase().includes("lap")) gapStr = d.Status;

                    // Update Season Standings
                    if(!seasonStandings[ev.season].drivers[dName]) seasonStandings[ev.season].drivers[dName] = { points: 0, team: tName };
                    seasonStandings[ev.season].drivers[dName].points += pts;
                    seasonStandings[ev.season].drivers[dName].team = tName; 
                    if(!seasonStandings[ev.season].teams[tName]) seasonStandings[ev.season].teams[tName] = 0;
                    seasonStandings[ev.season].teams[tName] += pts;

                    // Update Track Specific Aggregates
                    if (pos === 1 && ev.label === "Feature") trackStats[tNameStr].driverWins[dName] = (trackStats[tNameStr].driverWins[dName] || 0) + 1;
                    trackStats[tNameStr].driverPoints[dName] = (trackStats[tNameStr].driverPoints[dName] || 0) + pts;
                    
                    if (flTime > 0 && flTime < trackStats[tNameStr].lapRecord.time) {
                        trackStats[tNameStr].lapRecord = { time: flTime, driver: dName };
                    }

                    // Setup Driver Profiles
                    if (!driverStats[dName]) {
                        driverStats[dName] = { 
                            name: dName, currentTeam: tName, starts: 0, wins: 0, podiums: 0, 
                            fls: 0, poles: 0, dnfs: 0, penPts: 0, totalPtsSort: 0,
                            sumPos: 0, bestPos: 999, teamsTracked: {}, tracksTracked: {}, seasons: {}
                        };
                    }

                    let s = driverStats[dName];
                    s.currentTeam = tName; 
                    s.starts++;
                    s.penPts += penPts;
                    s.totalPtsSort += pts; 
                    
                    if (pos === 1) s.wins++;
                    if (pos <= 3) s.podiums++;
                    if (isFL) s.fls++;
                    
                    if (isDnf) s.dnfs++;
                    else {
                        s.sumPos += pos; 
                        if (pos < s.bestPos) s.bestPos = pos;
                    }

                    s.teamsTracked[tName] = (s.teamsTracked[tName] || 0) + 1;
                    s.tracksTracked[tNameStr] = (s.tracksTracked[tNameStr] || 0) + pts;

                    if (!s.seasons[ev.season]) s.seasons[ev.season] = { races: [] };
                    s.seasons[ev.season].races.push({ 
                        track: tNameStr, 
                        label: ev.label, 
                        pos: isDnf ? "DNF" : pos, 
                        fl: isFL, 
                        flTime: flTime,
                        gap: gapStr,
                        team: tName 
                    });
                });
            });
        }

        function formatFlagUrl(nat) {
            if (!nat) return "";
            // Maps to standard format: united_arab_emirates.png
            return `${photoBase}${nat.toLowerCase().replace(/\s+/g, '_')}.png`;
        }
        
        function getTeamLogoUrl(teamName) {
            let fileMap = { 
                "Aston Martin": "AM", 
                "Ferrari": "FER", 
                "McLaren": "MCL", 
                "Mercedes": "MER", 
                "Red Bull": "RB",
                "Alpine": "alpine", 
                "AlphaTauri": "alphatauri", 
                "Alfa Romeo": "alfaromeo"
            };
            let fName = fileMap[teamName] || teamName.toLowerCase().replace(/\s+/g, '');
            return `${photoBase}${fName}.png`; 
        }

        function getWDC(sNum, dName) {
            if (!seasonStandings[sNum] || !seasonStandings[sNum].drivers[dName]) return "-";
            let sortedS = Object.keys(seasonStandings[sNum].drivers).map(k => ({name: k, pts: seasonStandings[sNum].drivers[k].points})).sort((a,b) => b.pts - a.pts);
            let idx = sortedS.findIndex(x => x.name === dName);
            if (idx === -1) return "-";
            let p = idx + 1;
            
            if (sNum === currentSeasonMax) return `${p}${p===1?'st':p===2?'nd':p===3?'rd':'th'} Overall`;
            return p === 1 ? "Champion 👑" : p === 2 ? "2nd Overall" : p === 3 ? "3rd Overall" : `${p}th Overall`;
        }

        function switchMainTab(tab) {
            document.querySelectorAll('.stat-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.getElementById(`view-${tab}`).classList.add('active');
        }

        function renderDirectory() {
            document.getElementById('main-nav').style.display = "flex";
            document.querySelectorAll('.stat-tab')[0].classList.add('active'); 
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.getElementById('view-drivers').classList.add('active');

            const dDir = document.getElementById('driver-directory');
            dDir.innerHTML = "";
            let sortedDrivers = Object.values(driverStats).sort((a,b) => b.totalPtsSort - a.totalPtsSort);
            sortedDrivers.forEach(d => {
                let bgHex = teamColors[d.currentTeam] || '#444';
                dDir.innerHTML += `
                    <div class="directory-card" onclick="renderDriverProfile('${d.name}')">
                        <img src="${photoBase}${d.name.replace(/\s+/g, '')}.png" class="directory-photo" style="background-color: ${bgHex};" onerror="this.src='https://raw.githubusercontent.com/f1ladsleague/landing-page/main/Team_Photos/blank.png'">
                        <h3 class="directory-name">${d.name}</h3>
                        <div class="directory-sub">${d.currentTeam}</div>
                    </div>
                `;
            });

            const tDir = document.getElementById('track-directory');
            tDir.innerHTML = "";
            let sortedTracks = Object.values(trackStats).sort((a,b) => b.races - a.races);
            sortedTracks.forEach(t => {
                tDir.innerHTML += `
                    <div class="data-card" onclick="renderTrackProfile('${t.name}')">
                        <h3 class="data-card-title">${t.name}</h3>
                        <div class="data-card-stat">Features Hosted: ${t.races}</div>
                    </div>
                `;
            });
        }

        function renderDriverProfile(dName) {
            document.getElementById('main-nav').style.display = "none";
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            const container = document.getElementById('driver-profile-container');
            container.classList.add('active');

            let s = driverStats[dName];
            let p = driverProfiles[dName] || {};
            let bgHex = teamColors[s.currentTeam] || '#444';
            let flagHtml = p.Nationality ? `<img src="${formatFlagUrl(p.Nationality)}" class="flag-icon" title="${p.Nationality}" onerror="this.style.display='none'">` : '';
            
            let isRookie = (dName === "Sameera" || dName === "Nippa E");
            let rookieBadge = isRookie ? `<span class="rookie-badge">ROOKIE</span>` : '';

            let avgPos = (s.starts - s.dnfs) > 0 ? (s.sumPos / (s.starts - s.dnfs)).toFixed(1) : "-";
            let winPct = s.starts > 0 ? ((s.wins / s.starts) * 100).toFixed(1) + "%" : "0%";
            let podPct = s.starts > 0 ? ((s.podiums / s.starts) * 100).toFixed(1) + "%" : "0%";
            let bestTrack = Object.keys(s.tracksTracked).sort((a,b) => s.tracksTracked[b] - s.tracksTracked[a])[0] || "-";
            let debutSeason = Math.min(...Object.keys(s.seasons));

            // Extract former teams
            let formerTeamsHtml = "";
            let uniqueTeams = Object.keys(s.teamsTracked).filter(t => t !== s.currentTeam);
            if (uniqueTeams.length > 0) {
                formerTeamsHtml = `<div class="former-teams">Former Teams: ` + uniqueTeams.map(t => `<img src="${getTeamLogoUrl(t)}" class="former-team-logo" title="${t}" onerror="this.style.display='none'">`).join(' ') + `</div>`;
            }

            // Awards Box
            let awardsHtml = "";
            if (driverAwards[dName]) {
                let list = driverAwards[dName].map(aw => `<li>🏆 ${aw}</li>`).join('');
                awardsHtml = `
                    <div style="margin-top: 15px; background: rgba(255, 215, 0, 0.1); border: 1px solid rgba(255, 215, 0, 0.3); padding: 15px; border-radius: 8px; width: 100%;">
                        <h4 style="color: gold; margin: 0 0 10px 0; text-transform: uppercase; font-size: 13px; letter-spacing: 1px;">Awards & Accolades</h4>
                        <ul style="list-style: none; padding: 0; margin: 0; font-size: 14px; color: #ddd; display: flex; flex-direction: column; gap: 6px;">
                            ${list}
                        </ul>
                    </div>
                `;
            }

            let html = `
                <div class="profile-wrapper">
                    <div class="profile-header">
                        <button class="back-btn" onclick="exitToDirectory('drivers')">Back</button>
                        <img src="${photoBase}${dName.replace(/\s+/g, '')}.png" class="profile-photo" style="background-color: ${bgHex};" onerror="this.src='https://raw.githubusercontent.com/f1ladsleague/landing-page/main/Team_Photos/blank.png'">
                        <div class="profile-info">
                            <h2 class="profile-name">
                                ${dName} ${rookieBadge} ${flagHtml} 
                                <img src="${getTeamLogoUrl(s.currentTeam)}" class="team-logo-main" onerror="this.style.display='none'">
                            </h2>
                            <div class="profile-meta">
                                ${p.RaceNumber ? `<span class="meta-tag" style="background:var(--f1-red); color:#fff; border:none;">#${p.RaceNumber}</span>` : ''}
                                ${p.RealName ? `<span class="meta-tag">Real Name: ${p.RealName}</span>` : ''}
                                ${p.InGameName ? `<span class="meta-tag">In-Game: ${p.InGameName}</span>` : ''}
                                ${p.GamePlatform ? `<span class="meta-tag">Platform: ${p.GamePlatform}</span>` : ''}
                            </div>
                            ${formerTeamsHtml}
                            ${awardsHtml}
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-box"><div class="stat-value">${s.starts}</div><div class="stat-label">Race Starts</div></div>
                        <div class="stat-box"><div class="stat-value">${s.wins}</div><div class="stat-label">Wins (${winPct})</div></div>
                        <div class="stat-box"><div class="stat-value">${s.podiums}</div><div class="stat-label">Podiums (${podPct})</div></div>
                        <div class="stat-box"><div class="stat-value">${s.poles}</div><div class="stat-label">Pole Positions</div></div>
                        <div class="stat-box"><div class="stat-value">${s.fls}</div><div class="stat-label">Fastest Laps</div></div>
                        
                        <div class="stat-box"><div class="stat-value text-value">P${avgPos}</div><div class="stat-label">Average Finish</div></div>
                        <div class="stat-box"><div class="stat-value text-value">Season ${debutSeason}</div><div class="stat-label">Debut Season</div></div>
                        <div class="stat-box"><div class="stat-value" style="color:#ff8000;">${s.dnfs}</div><div class="stat-label">Total DNFs</div></div>
                        <div class="stat-box"><div class="stat-value" style="color:var(--f1-red);">${s.penPts}</div><div class="stat-label">Penalty Points</div></div>
                        <div class="stat-box"><div class="stat-value text-value" style="font-size:18px;">${bestTrack}</div><div class="stat-label">Best Track</div></div>
                    </div>

                    <div class="charts-section">
                        <div class="chart-container"><h4 class="chart-title">Average Finish Position (By Season)</h4><canvas id="avgPosChart"></canvas></div>
                        <div class="chart-container"><h4 class="chart-title">Race Finish Breakdown</h4><canvas id="distBarChart"></canvas></div>
                    </div>

                    <div class="history-section">
                        <h3 class="history-title">Season History</h3>
                        <div id="accordion-container"></div>
                    </div>
                </div>
            `;
            container.innerHTML = html;

            const accCont = document.getElementById('accordion-container');
            let sortedSeasons = Object.keys(s.seasons).sort((a,b) => b - a); 
            
            sortedSeasons.forEach(sNum => {
                let sData = s.seasons[sNum];
                
                // Calculate max grid size for this season
                let sGridSize = Object.keys(seasonStandings[sNum].drivers).length;

                let rows = sData.races.map(r => {
                    let rowStyle = "color: #fff;"; // Default to white
                    if (r.pos === "DNF" || r.pos === "DSQ") rowStyle = "color: var(--f1-red); font-style: italic;";
                    else if (r.pos === 1) rowStyle = "color: gold; font-weight: 700;";
                    else if (r.pos === 2) rowStyle = "color: #C0C0C0; font-weight: 700;";
                    else if (r.pos === 3) rowStyle = "color: #CD7F32; font-weight: 700;";

                    // Only the FL text goes purple if they got FL
                    let flStyle = r.fl ? "color: var(--fastest-lap); font-weight: 900;" : "";

                    return `
                        <tr style="${rowStyle}">
                            <td style="width:50px; text-align:center; font-weight:900;">${r.pos}</td>
                            <td>${r.track} <span style="opacity: 0.6; font-size:11px; font-weight: normal;">(${r.label})</span></td>
                            <td>${r.team}</td>
                            <td style="font-family:monospace;">${r.gap}</td>
                            <td style="font-family:monospace; ${flStyle}">${formatMs(r.flTime)}</td>
                        </tr>
                    `;
                }).join('');

                let champStatus = getWDC(parseInt(sNum), dName);
                
                accCont.innerHTML += `
                    <details ${sNum == sortedSeasons[0] ? 'open' : ''}>
                        <summary>Season ${sNum} <span class="summary-stats" style="color:#fff;">${champStatus} | Grid Size: ${sGridSize}</span></summary>
                        <div class="table-wrap">
                            <table>
                                <thead><tr>
                                    <th style="text-align:center;">Pos</th>
                                    <th>Track</th>
                                    <th>Car</th>
                                    <th>Gap to Leader</th>
                                    <th>Fastest Lap</th>
                                </tr></thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                    </details>
                `;
            });

            setTimeout(() => drawDriverCharts(s, sortedSeasons), 100);
        }

        function drawDriverCharts(s, sortedSeasons) {
            if(myChart1) myChart1.destroy();
            if(myChart2) myChart2.destroy();

            let labels = sortedSeasons.slice().reverse().map(num => `S${num}`);
            let avgData = sortedSeasons.slice().reverse().map(num => {
                let races = s.seasons[num].races.filter(r => r.pos !== "DNF");
                if (races.length === 0) return null;
                let sum = races.reduce((acc, curr) => acc + curr.pos, 0);
                return sum / races.length;
            });
            
            myChart1 = new Chart(document.getElementById('avgPosChart'), {
                type: 'line',
                data: { labels: labels, datasets: [{ label: 'Average Finish', data: avgData, borderColor: '#e10600', backgroundColor: 'rgba(225, 6, 0, 0.2)', borderWidth: 3, tension: 0.3, fill: true, pointRadius: 5 }] },
                options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { reverse: true, min: 1, max: 10, ticks: { stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.05)' } }, x: { grid: { display: false } } } }
            });

            let p1=0, p2=0, p3=0, p4=0, p5=0, p6=0, p7_10=0;
            Object.values(s.seasons).forEach(season => {
                season.races.forEach(r => {
                    if (r.pos === 1) p1++;
                    else if (r.pos === 2) p2++;
                    else if (r.pos === 3) p3++;
                    else if (r.pos === 4) p4++;
                    else if (r.pos === 5) p5++;
                    else if (r.pos === 6) p6++;
                    else if (r.pos >= 7 && r.pos <= 10) p7_10++;
                });
            });

            myChart2 = new Chart(document.getElementById('distBarChart'), {
                type: 'bar',
                data: {
                    labels: ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th-10th', 'DNFs'],
                    datasets: [{ data: [p1, p2, p3, p4, p5, p6, p7_10, s.dnfs], backgroundColor: ['#FFD700', '#C0C0C0', '#CD7F32', '#0090ff', '#00d2be', '#3671c6', '#555', '#e10600'], borderRadius: 4 }]
                },
                options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.05)' } }, x: { grid: { display: false } } } }
            });
        }

        // --- Track Profiles (Fully Built Out) ---
        function renderTrackProfile(tName) {
            document.getElementById('main-nav').style.display = "none";
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            const container = document.getElementById('track-profile-container');
            container.classList.add('active');

            let t = trackStats[tName];
            
            // Get Top Winner
            let topWinner = Object.keys(t.driverWins).sort((a,b) => t.driverWins[b] - t.driverWins[a])[0] || "-";
            // Get Top Points Scorer
            let topPointsDriver = Object.keys(t.driverPoints).sort((a,b) => t.driverPoints[b] - t.driverPoints[a])[0] || "-";
            // Lap Record Data
            let lapRecText = t.lapRecord.time < 999999999 ? `${formatMs(t.lapRecord.time)}<br><span style="font-size:12px;color:#888;">${t.lapRecord.driver}</span>` : "-";

            // Loop through every session held at this track
            let sessionAccordions = t.sessions.map((ev, idx) => {
                let sortedDrivers = ev.raceData.Drivers.sort((a, b) => a.Position - b.Position);
                let winnerTime = sortedDrivers.find(d => d.Position === 1)?.TimeInt || 0;

                let sessionRows = sortedDrivers.map(d => {
                    let isFL = ev.raceData.FastestLapDriver && ev.raceData.FastestLapDriver.Name === d.Driver.Name;
                    let isDnf = (d.Status !== "Ok" && d.Status !== "finished" && !d.Status.toLowerCase().includes("lap"));
                    
                    let gapStr = "-";
                    if (isDnf) gapStr = "DNF";
                    else if (d.Position === 1) gapStr = "Winner";
                    else if (d.TimeInt > 0 && winnerTime > 0) gapStr = formatGap(d.TimeInt - winnerTime);
                    else if (d.Status && d.Status.toLowerCase().includes("lap")) gapStr = d.Status;

                    return `
                        <tr class="${isFL ? 'fl-row' : ''}">
                            <td style="text-align:center; font-weight:900;">${d.Position}</td>
                            <td>${d.Driver.Name}</td>
                            <td>${d.Team ? d.Team.Name : "Unknown"}</td>
                            <td style="font-family:monospace;">${gapStr}</td>
                            <td style="font-family:monospace;">${formatMs(d.FastestLapTimeInt || 0)}</td>
                            <td style="text-align:center; color:var(--f1-red); font-weight:900;">${(d.DriverPointsRaw || 0) / 10}</td>
                        </tr>
                    `;
                }).join('');

                return `
                    <details ${idx === t.sessions.length - 1 ? 'open' : ''}>
                        <summary>Season ${ev.season} - ${ev.label} <span class="summary-stats">Grid Size: ${sortedDrivers.length}</span></summary>
                        <div class="table-wrap">
                            <table class="analysis-table">
                                <thead><tr>
                                    <th style="text-align:center;">Pos</th>
                                    <th>Driver</th>
                                    <th>Car</th>
                                    <th>Time / Gap</th>
                                    <th>Fastest Lap</th>
                                    <th style="text-align:center;">Pts</th>
                                </tr></thead>
                                <tbody>${sessionRows}</tbody>
                            </table>
                        </div>
                    </details>
                `;
            }).join('');

            let html = `
                <div class="profile-wrapper">
                    <div class="profile-header">
                        <button class="back-btn" onclick="exitToDirectory('tracks')">Back</button>
                        <div>
                            <h2 class="profile-name">${tName} Circuit</h2>
                            <div class="profile-meta"><span class="meta-tag">Total Sessions Hosted: ${t.sessions.length}</span></div>
                        </div>
                    </div>
                    
                    <div class="stats-grid" style="grid-template-columns: repeat(4, 1fr);">
                        <div class="stat-box"><div class="stat-value text-value">${topWinner}</div><div class="stat-label">Most Feature Wins</div></div>
                        <div class="stat-box"><div class="stat-value text-value">${topPointsDriver}</div><div class="stat-label">Most Points Scored</div></div>
                        <div class="stat-box"><div class="stat-value text-value" style="font-family:monospace; line-height: 1.2;">${lapRecText}</div><div class="stat-label">All-Time Lap Record</div></div>
                        <div class="stat-box"><div class="stat-value">${t.races}</div><div class="stat-label">Feature Races Held</div></div>
                    </div>

                    <div class="charts-section" style="grid-template-columns: 1fr;">
                        <div class="chart-container"><h4 class="chart-title">Top 5 Drivers by Points at ${tName}</h4><canvas id="trackPointsChart" style="max-height: 300px;"></canvas></div>
                    </div>

                    <div class="history-section">
                        <h3 class="history-title">Session History</h3>
                        ${sessionAccordions || '<p>No historical data</p>'}
                    </div>
                </div>
            `;
            container.innerHTML = html;

            setTimeout(() => drawTrackChart(t), 100);
        }

        function drawTrackChart(t) {
            if(myChart3) myChart3.destroy();

            // Sort drivers by points at this track and take top 5
            let topDrivers = Object.keys(t.driverPoints)
                                   .sort((a, b) => t.driverPoints[b] - t.driverPoints[a])
                                   .slice(0, 5);
            let pointValues = topDrivers.map(d => t.driverPoints[d]);

            myChart3 = new Chart(document.getElementById('trackPointsChart'), {
                type: 'bar',
                data: {
                    labels: topDrivers,
                    datasets: [{ label: 'Total Points', data: pointValues, backgroundColor: 'rgba(225, 6, 0, 0.8)', borderRadius: 4 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } }, x: { grid: { display: false } } } }
            });
        }

        function exitToDirectory(tabName) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.getElementById('main-nav').style.display = "flex";
            document.getElementById(`view-${tabName}`).classList.add('active');
            
            document.querySelectorAll('.stat-tab').forEach(t => t.classList.remove('active'));
            if(tabName === 'drivers') document.querySelectorAll('.stat-tab')[0].classList.add('active');
            if(tabName === 'tracks') document.querySelectorAll('.stat-tab')[1].classList.add('active');
        }

        window.onload = initData;
    </script>
</body>
</html>
